server {
    listen 80;
    listen [::]:80;
    server_name i.joysb.icu;

    location ^~ /.well-known/acme-challenge/ {
        root /www/sites/i.joysb.icu/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://i.joysb.icu$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name i.joysb.icu;

    ssl_certificate /www/sites/i.joysb.icu/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/i.joysb.icu/ssl/privkey.pem;

    root /www/sites/i.joysb.icu/dist;
    index index.html;
    access_log /www/sites/i.joysb.icu/log/access.log main;
    error_log /www/sites/i.joysb.icu/log/error.log;

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4178/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 100s;
        client_max_body_size 8m;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /audio/ {
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
